<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | City United FC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-badge">CU</span>
      <span>City United FC</span>
    </a>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="team.html">Team</a>
      <a href="fixtures.html">Fixtures</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1>Contact Us</h1>
      <p>Get in touch with City United FC.</p>
    </section>

    <section class="section">
      <div class="contact-grid">
        <div class="contact-info">
          <h2>Club Information</h2>
          <p><strong>Email:</strong> info@cityunitedfc.com</p>
          <p><strong>Phone:</strong> +852 0000 0000</p>
          <p><strong>Location:</strong> Kwai Chung, Hong Kong</p>

          <div class="image-box small">
            <span>Insert club location photo here</span>
          </div>
        </div>

        <form class="contact-form">
          <h2>Send a Message</h2>

          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Enter a subject">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Write your message" required></textarea>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 City United FC. All rights reserved.</p>
  </footer>

</body>
</html>
